# Levanta VuelvoSeguro con su base SQL Server:
#   docker compose up -d --build
# La app queda en http://localhost:8080
# Las contraseñas se pueden cambiar en un archivo .env (ver .env.example).

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-VuelvoSeguro#2026}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build: .
    image: vuelvoseguro:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=VuelvoSeguroDb;User Id=sa;Password=${SA_PASSWORD:-VuelvoSeguro#2026};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Administrador que se crea al iniciar si todavía no existe.
      AdminInicial__Email: ${ADMIN_EMAIL:-admin@vuelvoseguro.com}
      AdminInicial__Password: ${ADMIN_PASSWORD:-Admin123!}
    volumes:
      - documentos:/app/App_Data/documentos
      - claves:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  sqldata:
  documentos:
  claves:
